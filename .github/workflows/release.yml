name: Python IL STS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (Eg. 1.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Pre-Release'
        required: false
        type: boolean

env:
  is_prerelease: ${{ inputs.prerelease }}
  release_version: ${{ inputs.version }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install requirements
        run: |
          pip install -r docs/requirements.txt

      - name: Extract version and organization
        id: extract_info
        run: |
          $content = Get-Content -Path python_il_sts/__about__.py -Raw
          $date = [regex]::Match($content, '__date__ = "(.*?)"').Groups[1].Value
          $version = [regex]::Match($content, '__version__ = "(.*?)"').Groups[1].Value
          $organization = [regex]::Match($content, '__organization__ = "(.*?)"').Groups[1].Value
          echo "date=$date" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_ENV
          echo "organization=$organization" >> $env:GITHUB_ENV

      - name: Create Python_IL_STS and package files
        run: |
          $version = $env:version
          $dest = "Python_IL_STS_$version"
          
          # Remove directory if it exists
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
      
          # Create root directory
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
      
          # Move project items into Python_IL_STS
          $items = "python_il_sts", "main.py", "examples", "docs", "README.md", "README.jp.md", "LICENSE"
          
          foreach ($item in $items) {
            if (Test-Path $item) {
              Move-Item -Path $item -Destination $dest -Force
            }
          }
      
          # Create ZIP
          $zipFileName = "Python_IL_STS_$version.zip"
          Compress-Archive -Path "$dest\*" -DestinationPath $zipFileName -Force

      - name: Set Tag Name and Release Name
        id: set_tag_info
        run: |
          $version = $env:version
          $release_version = $env:release_version
          if ($release_version) {
            $tag = "v$release_version"
            $release_name = "Release $release_version"
          } else {
            $tag = "v$version"
            $release_name = "Release $version"
          }
          echo "tag_name=$tag" >> $env:GITHUB_ENV
          echo "release_name=$release_name" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: ${{ env.release_name }}
          draft: false
          prerelease: ${{ env.is_prerelease }}
          files: |
            Python_IL_STS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Release Type
        run: |
          $message = "A $($env:GITHUB_EVENT_INPUTS_RELEASE) has been created."
          Write-Host $message